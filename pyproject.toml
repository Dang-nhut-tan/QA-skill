[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-system"
version = "1.1.0"
description = "Evidence-based, human-controlled QA agent workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QA Agent System contributors" }]
dependencies = [
  "openpyxl>=3.1.2,<4",
  "tiktoken>=0.7.0,<1",
  "markitdown[all]>=0.1.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10",
  "pytest-cov>=5.0.0,<8",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
