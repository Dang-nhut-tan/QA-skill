name: Nightly Playwright Regression Test

on:
  schedule:
    # Run nightly at 02:00 AM ICT (19:00 UTC)
    - cron: '0 19 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target Application Base URL'
        required: false
        default: 'http://localhost:3000'

jobs:
  python-integrity:
    name: Python Integrity and Architecture
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Python Regression Suite
      run: pytest -v tests/

    - name: Validate System Architecture
      run: python scripts/validate_system.py

  playwright-e2e:
    name: Headless Playwright Regression
    needs: python-integrity
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Tests
      env:
        CI: true
        BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
      run: npx playwright test --reporter=html,junit

    - name: Upload Playwright Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
